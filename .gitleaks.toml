# Secret scanning in CI (see the guardrails in .github/RELEASE_PROCESS.md). Extends the default rules
# with one that finds home-folder paths, which reveal the owner's machine. Slashes are escaped so this
# file never matches its own rule or the tracked-files check.
[extend]
useDefault = true

[[rules]]
id = "home-folder-path"
description = "Absolute path into a home folder, which reveals the machine and its user"
regex = '''(?i)(?:\b[a-z]:(?:\\\\|\\|\/)users(?:\\\\|\\|\/)[^\\\/\s'"`]+|\/[a-z]\/users\/[^\/\s'"`]+\/|(?:^|[\s'"`=])\/(?:users|home)\/[^\/\s'"`]+\/)'''
keywords = ["users", "home"]

  # The node and runner accounts belong to Docker images and CI runners, not to anyone's machine.
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''\/home\/(?:node|runner)\/''']

# localStorage key names such as gymmy_pending_ops_v1 sit in constants named *_KEY, which the generic
# API key rule reads as secrets. They are public names listed in src/services/STORAGE.md.
[[allowlists]]
description = "localStorage key names"
regexes = ['''^gymmy_[a-z0-9_]+_v\d+$''']
