# Weekly update pull requests for npm packages and the pinned GitHub Actions.
version: 2
updates:
  # Minor and patch updates arrive as one grouped pull request; each major gets its own. The cooldown matches
  # min-release-age in .npmrc, so Dependabot doesn't propose a version npm would refuse. Security updates, a
  # repository setting, would skip it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # @types/node follows the oldest Node version Gymmy supports (engines in package.json, .nvmrc). Newer major
    # types would let the typecheck pass code that calls APIs Node 22 doesn't have. Remove this when the minimum
    # Node version goes up, and bump @types/node with it.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
